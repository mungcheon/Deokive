<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Deokive Catalog</title>
  <style>
    :root {
      color-scheme: light;
      --bg: #f7f7f8;
      --card: rgba(255, 255, 255, 0.88);
      --line: #e5e5ea;
      --text: #1d1d1f;
      --muted: #6e6e73;
      --accent: #2f7cf6;
      --shadow: 0 18px 48px rgba(20, 24, 36, 0.1);
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      background: var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }

    header {
      position: sticky;
      top: 0;
      z-index: 10;
      border-bottom: 1px solid var(--line);
      background: rgba(247, 247, 248, 0.84);
      backdrop-filter: blur(18px);
    }

    .bar,
    main {
      width: min(1120px, calc(100% - 32px));
      margin: 0 auto;
    }

    .bar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      min-height: 68px;
    }

    h1 {
      margin: 0;
      font-size: 22px;
      letter-spacing: 0;
    }

    a {
      color: var(--accent);
      text-decoration: none;
      font-weight: 700;
    }

    main {
      padding: 28px 0 48px;
    }

    .summary {
      display: grid;
      grid-template-columns: repeat(4, minmax(0, 1fr));
      gap: 12px;
      margin-bottom: 18px;
    }

    .metric,
    .toolbar,
    .item {
      border: 1px solid var(--line);
      border-radius: 8px;
      background: var(--card);
      box-shadow: var(--shadow);
    }

    .metric {
      padding: 16px;
    }

    .metric b {
      display: block;
      font-size: 24px;
    }

    .metric span {
      color: var(--muted);
      font-size: 13px;
    }

    .toolbar {
      display: grid;
      grid-template-columns: 1fr 180px 180px;
      gap: 10px;
      padding: 12px;
      margin-bottom: 18px;
    }

    input,
    select {
      width: 100%;
      height: 42px;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: #fff;
      color: var(--text);
      padding: 0 12px;
      font: inherit;
    }

    .list {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
      gap: 14px;
    }

    .item {
      overflow: hidden;
    }

    .thumb {
      width: 100%;
      aspect-ratio: 1;
      background: #ececf0;
      object-fit: cover;
      display: block;
    }

    .body {
      padding: 12px;
    }

    .body strong {
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
      min-height: 42px;
      font-size: 15px;
      line-height: 1.35;
    }

    .meta {
      margin-top: 8px;
      display: grid;
      gap: 4px;
      color: var(--muted);
      font-size: 12px;
    }

    .empty {
      border: 1px solid var(--line);
      border-radius: 8px;
      background: #fff;
      padding: 24px;
      color: var(--muted);
      text-align: center;
    }

    @media (max-width: 720px) {
      .summary {
        grid-template-columns: repeat(2, minmax(0, 1fr));
      }

      .toolbar {
        grid-template-columns: 1fr;
      }
    }
  </style>
</head>
<body>
  <header>
    <div class="bar">
      <h1>Deokive Catalog</h1>
      <a href="/">앱으로 돌아가기</a>
    </div>
  </header>
  <main>
    <section class="summary" aria-label="카탈로그 요약">
      <div class="metric"><b id="total">-</b><span>전체 굿즈</span></div>
      <div class="metric"><b id="withImage">-</b><span>사진 있음</span></div>
      <div class="metric"><b id="stores">-</b><span>출처 스토어</span></div>
      <div class="metric"><b id="updated">-</b><span>DB 업데이트</span></div>
    </section>
    <section class="toolbar" aria-label="필터">
      <input id="search" type="search" placeholder="이름, 시리즈, 캐릭터 검색" autocomplete="off">
      <select id="category"><option value="">전체 분류</option></select>
      <select id="store"><option value="">전체 스토어</option></select>
    </section>
    <section id="list" class="list" aria-live="polite"></section>
  </main>
  <script>
    const state = { items: [], filtered: [] };
    const fmt = new Intl.NumberFormat('ko-KR');

    function text(value) {
      return value == null ? '' : String(value);
    }

    function escapeHtml(value) {
      return text(value)
        .replaceAll('&', '&amp;')
        .replaceAll('<', '&lt;')
        .replaceAll('>', '&gt;')
        .replaceAll('"', '&quot;')
        .replaceAll("'", '&#039;');
    }

    function localImagePath(item) {
      const local = text(item.local_image_path);
      if (!local) return text(item.image_url);
      return local.startsWith('/') ? local : local;
    }

    function searchable(item) {
      return [
        item.name_ko,
        item.name_ja,
        item.name_en,
        item.series_name,
        item.sub_series,
        item.character_name,
        item.affiliation,
        item.category,
        item.source_store,
        item.barcode,
      ].map(text).join(' ').toLowerCase();
    }

    function fillSelect(id, values) {
      const select = document.getElementById(id);
      for (const value of values) {
        const option = document.createElement('option');
        option.value = value;
        option.textContent = value;
        select.append(option);
      }
    }

    function renderSummary(payload) {
      document.getElementById('total').textContent = fmt.format(state.items.length);
      document.getElementById('withImage').textContent = fmt.format(
        state.items.filter((item) => item.image_url || item.local_image_path).length
      );
      document.getElementById('stores').textContent = fmt.format(
        new Set(state.items.map((item) => text(item.source_store)).filter(Boolean)).size
      );
      document.getElementById('updated').textContent =
        text(payload.meta?.updated_at || payload.updated_at || '').slice(0, 10) || '-';
    }

    function renderList() {
      const list = document.getElementById('list');
      if (!state.filtered.length) {
        list.innerHTML = '<div class="empty">검색 결과가 없어요.</div>';
        return;
      }
      const fragment = document.createDocumentFragment();
      for (const item of state.filtered.slice(0, 120)) {
        const article = document.createElement('article');
        article.className = 'item';
        const img = localImagePath(item);
        article.innerHTML = `
          ${img ? `<img class="thumb" src="${escapeHtml(img)}" alt="">` : '<div class="thumb"></div>'}
          <div class="body">
            <strong>${escapeHtml(item.name_ko || item.name_ja || item.name_en || '이름 미확인 굿즈')}</strong>
            <div class="meta">
              <span>${escapeHtml([item.series_name, item.character_name].filter(Boolean).join(' · '))}</span>
              <span>${escapeHtml([item.category, item.source_store].filter(Boolean).join(' · '))}</span>
              <span>${item.official_price_jpy == null ? '가격 미확인' : `${fmt.format(item.official_price_jpy)} JPY`}</span>
            </div>
          </div>
        `;
        fragment.append(article);
      }
      list.replaceChildren(fragment);
    }

    function applyFilters() {
      const query = document.getElementById('search').value.trim().toLowerCase();
      const category = document.getElementById('category').value;
      const store = document.getElementById('store').value;
      state.filtered = state.items.filter((item) => {
        if (query && !item._search.includes(query)) return false;
        if (category && item.category !== category) return false;
        if (store && item.source_store !== store) return false;
        return true;
      });
      renderList();
    }

    async function init() {
      const list = document.getElementById('list');
      list.innerHTML = '<div class="empty">카탈로그 DB를 불러오는 중이에요.</div>';
      try {
        const response = await fetch('data/catalog_public.json?v=single-db', { cache: 'no-store' });
        if (!response.ok) throw new Error(`HTTP ${response.status}`);
        const payload = await response.json();
        state.items = (payload.items || []).map((item) => ({ ...item, _search: searchable(item) }));
        state.filtered = state.items;
        fillSelect('category', [...new Set(state.items.map((item) => item.category).filter(Boolean))].sort());
        fillSelect('store', [...new Set(state.items.map((item) => item.source_store).filter(Boolean))].sort());
        renderSummary(payload);
        renderList();
      } catch (error) {
        list.innerHTML = `<div class="empty">카탈로그 DB를 불러오지 못했어요. ${escapeHtml(error.message || error)}</div>`;
      }
    }

    document.getElementById('search').addEventListener('input', applyFilters);
    document.getElementById('category').addEventListener('change', applyFilters);
    document.getElementById('store').addEventListener('change', applyFilters);
    init();
  </script>
</body>
</html>
