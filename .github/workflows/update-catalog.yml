name: Update public catalog DB

on:
  workflow_dispatch:
  schedule:
    # Daily 04:20 KST
    - cron: "20 19 * * *"

permissions:
  contents: write

jobs:
  update-public-db:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Verify catalog tooling
        run: |
          python -X utf8 -m unittest \
            tools.test_update_workflow_integrity \
            tools.test_build_catalog_update_backlog \
            tools.test_catalog_quality_report \
            tools.test_build_catalog_naming_quality_queue \
            tools.test_validate_agent_goods_intake \
            tools.test_import_agent_goods_intake \
            tools.test_validate_agent_catalog_image_updates \
            tools.test_import_agent_catalog_image_updates \
            tools.test_audit_public_data_layout \
            tools.test_audit_public_catalog_image_assets \
            tools.test_audit_catalog_report_consistency \
            tools.test_audit_catalog_character_names \
            tools.test_normalize_catalog_characters_and_ichiban \
            tools.test_build_ichiban_public_quality_queue \
            tools.test_build_image_enrichment_queue \
            tools.test_build_image_update_work_packs \
            tools.test_sync_missing_image_work_queue_public

      - name: Publish 1-minute update notice
        run: |
          git config user.name "deokive-catalog-bot"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          python - <<'PY'
          import json
          from pathlib import Path

          status = {
              "mode": "notice",
              "message": "1분 뒤 공개 DB 업데이트를 시작합니다. 작업 중이라면 종료 부탁드려요.",
              "eta": "업데이트 시작 1분 전",
          }
          Path("data/site_status_public.json").write_text(
              json.dumps(status, ensure_ascii=False, indent=2) + "\n",
              encoding="utf-8",
          )
          PY
          git add data/site_status_public.json
          if git diff --cached --quiet; then
            echo "Update notice already published."
          else
            git commit -m "chore: announce public catalog update"
            git push
          fi
          sleep 60

      - name: Mark site updating
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          status = {
              "mode": "updating",
              "message": "공개 DB를 반영하고 있어요. 잠시 뒤 다시 접속해 주세요.",
              "eta": "예상 업데이트 시간 5-15분",
          }
          Path("data/site_status_public.json").write_text(
              json.dumps(status, ensure_ascii=False, indent=2) + "\n",
              encoding="utf-8",
          )
          PY
          git add data/site_status_public.json
          if git diff --cached --quiet; then
            echo "Public site is already marked updating."
          else
            git commit -m "chore: mark public catalog updating"
            git push
          fi

      - name: Refresh public catalog DB
        run: |
          python tools/validate_agent_goods_intake.py data/intake/incoming
          python tools/import_agent_goods_intake.py data/intake/incoming --write
          python tools/validate_agent_catalog_image_updates.py data/intake/image_updates/incoming
          python tools/import_agent_catalog_image_updates.py data/intake/image_updates/incoming --write
          python tools/catalog_quality_report.py
          python tools/build_catalog_field_enrichment_queue.py
          python tools/build_catalog_naming_quality_queue.py
          python tools/build_ichiban_public_quality_queue.py
          python tools/audit_catalog_character_names.py --write --fail-on-findings
          python tools/build_image_enrichment_queue.py
          python tools/build_image_update_work_packs.py
          python tools/build_source_discovery_queue.py
          python tools/audit_public_catalog_image_assets.py --write
          python tools/sync_missing_image_work_queue_public.py --write
          python tools/build_catalog_update_backlog.py
          python tools/audit_catalog_report_consistency.py --core-only --fail-on-mismatch
          python tools/generate_seed_catalog_dart.py --input data/catalog_public.json --output lib/data/catalog/seed_catalog.dart
          python tools/audit_flutter_seed_matches_public.py
          python tools/audit_public_data_layout.py

      - name: Commit public DB updates
        run: |
          git config user.name "deokive-catalog-bot"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add \
            data/catalog_public.json \
            data/catalog_public_meta.json \
            data/site_status_public.json \
            data/intake \
            lib/data/catalog/seed_catalog.dart \
            assets/catalog_images \
            assets/assets/catalog_images
          if git diff --cached --quiet; then
            echo "No public catalog DB changes."
          else
            git commit -m "chore: refresh public catalog DB"
            git push
          fi

      - name: Reopen public site
        if: always()
        run: |
          git config user.name "deokive-catalog-bot"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          python - <<'PY'
          import json
          from pathlib import Path

          Path("data/site_status_public.json").write_text(
              json.dumps({"mode": "normal", "message": "", "eta": ""}, ensure_ascii=False, indent=2)
              + "\n",
              encoding="utf-8",
          )
          PY
          git add data/site_status_public.json
          if git diff --cached --quiet; then
            echo "Public site status already normal."
          else
            git commit -m "chore: reopen public site"
            git push
          fi
