name: Update public catalog DB

on:
  workflow_dispatch:
    inputs:
      image_provider_store:
        description: "Optional strict official image provider, such as FuRyu, goodsmile, Taito, or Banpresto."
        required: false
        default: ""
      image_provider_max_rows:
        description: "Optional max rows for the image provider run."
        required: false
        default: ""
  schedule:
    # Daily 04:20 KST
    - cron: "20 19 * * *"

permissions:
  contents: write

jobs:
  update-public-db:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Publish 1-minute update notice
        run: |
          git config user.name "deokive-catalog-bot"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          python - <<'PY'
          import json
          from pathlib import Path

          status = {
              "mode": "notice",
              "message": "1분 뒤 공개 DB 업데이트를 시작합니다. 작업 중이라면 종료 부탁드려요.",
              "eta": "업데이트 시작 1분 전",
          }
          Path("data/site_status_public.json").write_text(
              json.dumps(status, ensure_ascii=False, indent=2) + "\n",
              encoding="utf-8",
          )
          PY
          git add data/site_status_public.json
          if git diff --cached --quiet; then
            echo "Update notice already published."
          else
            git commit -m "chore: announce public catalog update"
            git push
          fi
          sleep 60

      - name: Mark site updating
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          status = {
              "mode": "updating",
              "message": "공개 DB를 반영하고 있어요. 잠시 후 다시 접속해 주세요.",
              "eta": "예상 업데이트 시간 5-15분",
          }
          Path("data/site_status_public.json").write_text(
              json.dumps(status, ensure_ascii=False, indent=2) + "\n",
              encoding="utf-8",
          )
          PY
          git add data/site_status_public.json
          if git diff --cached --quiet; then
            echo "Public site is already marked updating."
          else
            git commit -m "chore: mark public catalog updating"
            git push
          fi

      - name: Refresh public catalog DB
        run: |
          image_args=()
          if [ -n "${{ github.event.inputs.image_provider_store }}" ]; then
            image_args+=(--image-provider-store "${{ github.event.inputs.image_provider_store }}")
          fi
          if [ -n "${{ github.event.inputs.image_provider_max_rows }}" ]; then
            image_args+=(--image-provider-max-rows "${{ github.event.inputs.image_provider_max_rows }}")
          fi

          python tools/validate_agent_goods_intake.py data/intake/incoming
          python tools/sync_catalog_pipeline.py --write --skip-network --skip-db "${image_args[@]}"
          python tools/generate_seed_catalog_dart.py --input data/catalog_public.json --output lib/data/catalog/seed_catalog.dart
          python tools/audit_flutter_seed_matches_public.py

      - name: Commit public DB updates
        run: |
          git config user.name "deokive-catalog-bot"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add \
            data/catalog_public.json \
            data/catalog_public_meta.json \
            data/site_status_public.json \
            lib/data/catalog/seed_catalog.dart \
            assets/catalog_images \
            assets/assets/catalog_images
          if git diff --cached --quiet; then
            echo "No public catalog DB changes."
          else
            git commit -m "chore: refresh public catalog DB"
            git push
          fi

      - name: Reopen public site
        if: always()
        run: |
          git config user.name "deokive-catalog-bot"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          python - <<'PY'
          import json
          from pathlib import Path

          Path("data/site_status_public.json").write_text(
              json.dumps({"mode": "normal", "message": "", "eta": ""}, ensure_ascii=False, indent=2)
              + "\n",
              encoding="utf-8",
          )
          PY
          git add data/site_status_public.json
          if git diff --cached --quiet; then
            echo "Public site status already normal."
          else
            git commit -m "chore: reopen public site"
            git push
          fi
